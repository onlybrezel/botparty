bind 0.0.0.0
protected-mode yes
appendonly no
save 900 1
save 300 10
save 60 10000
maxmemory 256mb
maxmemory-policy allkeys-lru

# Disable high-risk operator commands in production.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command DEBUG ""
rename-command MODULE ""
rename-command SHUTDOWN ""