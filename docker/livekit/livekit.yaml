# LiveKit Server Configuration
port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  use_external_ip: true

logging:
  level: info
  pion_level: warn

room:
  auto_create: true
  empty_timeout: 300       # 5 min
  max_participants: 1000

redis:
  address: 172.18.0.2:6379
  password: ${REDIS_PASSWORD}

ingress:
  whip_base_url: https://botparty.live/whip

# Recording (optional – enable for session recording)
