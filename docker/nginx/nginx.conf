worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ─────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Performance ─────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ─── Security Headers ────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss: http: https:;" always;

    # ─── Rate Limiting ───────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ─── Upstreams ───────────────────────────────────
    upstream web {
        server web:3000;
    }

    upstream api {
        server api:4000;
    }
    # LiveKit is accessed directly by clients on ports 7880-7882 (no nginx proxy needed)

    # ─── HTTP → HTTPS redirect ───────────────────────────
    # Uncomment the return line below and remove the proxy locations
    # when running with SSL. setup-env.sh does this automatically.
    server {
        listen 80;
        server_name _;

        # For development / HTTP-only: proxy directly.
        # For SSL: uncomment the next line and remove all location blocks below.
        # return 301 https://$host$request_uri;

        # ─── API ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Auth endpoints (stricter rate limit) ────
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── WebSocket ──────────────────────────────
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ─── Swagger Docs ───────────────────────────
        location /docs {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # ─── Frontend (catch-all) ───────────────────
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── HTTPS server block (template) ───────────────────────────────────────
    # Uncommented automatically by setup-env.sh when you choose SSL.
    # To enable manually: remove the leading "# " from every #HTTPS# line
    # and set server_name to your domain.
    #
    # ##HTTPS_BLOCK_START##
    #HTTPS# server {
    #HTTPS#     listen 443 ssl http2;
    #HTTPS#     server_name BOTPARTY_DOMAIN;
    #HTTPS#
    #HTTPS#     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #HTTPS#     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #HTTPS#
    #HTTPS#     ssl_protocols       TLSv1.2 TLSv1.3;
    #HTTPS#     ssl_ciphers         HIGH:!aNULL:!MD5;
    #HTTPS#     ssl_session_cache   shared:SSL:10m;
    #HTTPS#     ssl_session_timeout 10m;
    #HTTPS#
    #HTTPS#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #HTTPS#     add_header X-Frame-Options "SAMEORIGIN" always;
    #HTTPS#     add_header X-Content-Type-Options "nosniff" always;
    #HTTPS#
    #HTTPS#     limit_req_zone $binary_remote_addr zone=api_ssl:10m rate=30r/s;
    #HTTPS#     limit_req_zone $binary_remote_addr zone=auth_ssl:10m rate=5r/m;
    #HTTPS#
    #HTTPS#     location /api/ {
    #HTTPS#         limit_req zone=api_ssl burst=60 nodelay;
    #HTTPS#         proxy_pass http://api;
    #HTTPS#         proxy_set_header Host $host;
    #HTTPS#         proxy_set_header X-Real-IP $remote_addr;
    #HTTPS#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #HTTPS#         proxy_set_header X-Forwarded-Proto https;
    #HTTPS#     }
    #HTTPS#
    #HTTPS#     location /api/v1/auth/ {
    #HTTPS#         limit_req zone=auth_ssl burst=10 nodelay;
    #HTTPS#         proxy_pass http://api;
    #HTTPS#         proxy_set_header Host $host;
    #HTTPS#         proxy_set_header X-Real-IP $remote_addr;
    #HTTPS#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #HTTPS#         proxy_set_header X-Forwarded-Proto https;
    #HTTPS#     }
    #HTTPS#
    #HTTPS#     location /ws {
    #HTTPS#         proxy_pass http://api;
    #HTTPS#         proxy_http_version 1.1;
    #HTTPS#         proxy_set_header Upgrade $http_upgrade;
    #HTTPS#         proxy_set_header Connection "upgrade";
    #HTTPS#         proxy_set_header Host $host;
    #HTTPS#         proxy_set_header X-Real-IP $remote_addr;
    #HTTPS#         proxy_read_timeout 86400;
    #HTTPS#     }
    #HTTPS#
    #HTTPS#     location / {
    #HTTPS#         proxy_pass http://web;
