global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: botparty-api
    metrics_path: /api/v1/health/metrics
    basic_auth:
      username: metrics
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: [api:4000]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
