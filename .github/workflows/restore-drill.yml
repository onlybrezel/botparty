name: Backup Restore Drill

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 1 * *'
  release:
    types: [published]

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Start isolated backup sources
        run: |
          docker run -d --name drill-source-pg -e POSTGRES_PASSWORD=source_password -e POSTGRES_DB=botparty -p 127.0.0.1:35432:5432 postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          docker run -d --name drill-source-storage --hostname drill-source-storage -e AWS_ACCESS_KEY_ID=source_access -e AWS_SECRET_ACCESS_KEY=source_secret_123 -p 127.0.0.1:39000:8333 chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602 mini -dir=/data -ip=drill-source-storage -master.telemetry=false -webdav=false -admin.ui=false
          wait_for_postgres() {
            for ((attempt = 1; attempt <= 60; attempt++)); do
              if docker exec drill-source-pg pg_isready -U postgres -d botparty; then
                return 0
              fi
              sleep 1
            done
            echo 'PostgreSQL source did not become ready within 60 seconds.' >&2
            return 1
          }
          wait_for_storage() {
            for ((attempt = 1; attempt <= 60; attempt++)); do
              if docker run --rm --network host -e AWS_ACCESS_KEY_ID=source_access -e AWS_SECRET_ACCESS_KEY=source_secret_123 -e AWS_DEFAULT_REGION=us-east-1 amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab --endpoint-url http://127.0.0.1:39000 s3api list-buckets >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo 'Object-storage source did not become ready within 60 seconds.' >&2
            return 1
          }
          wait_for_postgres
          wait_for_storage
      - name: Provision deterministic database and objects
        env:
          DATABASE_URL: postgresql://postgres:source_password@127.0.0.1:35432/botparty?schema=public
          NODE_ENV: test
          SEED_E2E_FIXTURES: 'true'
          SEED_ADMIN_EMAIL: admin@botparty.test
          SEED_ADMIN_USERNAME: restore_admin
          SEED_ADMIN_PASSWORD: restore-admin-password-at-least-16
          SEED_DEMO_USER_PASSWORD: restore-user-password
        run: |
          pnpm --filter @botparty/prisma db:migrate:prod
          pnpm --filter @botparty/prisma db:seed
          mkdir -p data/drill-object data/drill-secrets
          printf fixture > data/drill-object/fixture.txt
          docker run --rm --network host --entrypoint /bin/sh --security-opt no-new-privileges:true --cap-drop ALL -e AWS_ACCESS_KEY_ID=source_access -e AWS_SECRET_ACCESS_KEY=source_secret_123 -e AWS_DEFAULT_REGION=us-east-1 -v "$PWD/data/drill-object:/fixture:ro" amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab -ec 'for b in botparty-thumbnails botparty-recordings; do aws --endpoint-url http://127.0.0.1:39000 s3 mb "s3://$b"; aws --endpoint-url http://127.0.0.1:39000 s3 cp /fixture/fixture.txt "s3://$b/fixture.txt"; done'
          docker exec -i drill-source-pg psql -U postgres -d botparty -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO sessions (id, "robotId", "userId", status, "startedAt", "endedAt", "createdAt")
          SELECT '10000000-0000-0000-0000-000000000001', r.id, r."ownerId", 'ENDED', now() - interval '1 minute', now(), now()
          FROM robots r WHERE r.slug = 'test-robot';
          INSERT INTO recordings (id, "sessionId", "robotId", "cameraId", "egressId", "objectKey", "startedAt", "endedAt", "createdAt")
          SELECT '20000000-0000-0000-0000-000000000001', s.id, s."robotId", 'restore-camera', 'restore-egress', 'fixture.txt', s."startedAt", s."endedAt", now()
          FROM sessions s WHERE s.id = '10000000-0000-0000-0000-000000000001';
          SQL
          for name in jwt_secret jwt_refresh_secret robot_jwt_secret webhook_secret_encryption_key payout_destination_encryption_key livekit_api_secret; do printf 'restore-drill-%s-at-least-32-characters' "$name" > "data/drill-secrets/$name"; done
          printf 'postgresql://postgres:source_password@127.0.0.1:35432/botparty?schema=public' > data/drill-secrets/api_database_url
          printf 'restore-drill-redis-password' > data/drill-secrets/redis_password
          printf 'source_secret_123' > data/drill-secrets/object_storage_secret_access_key
          printf 'restore-drill-metrics-password' > data/drill-secrets/metrics_password
          printf 'restore-admin-password-at-least-16' > data/drill-secrets/seed_admin_password
          : > data/drill-secrets/smtp_password
          printf 'source_secret_123' > data/drill-secrets/backup_s3_secret
          printf 'restore-drill-backup-encryption-key-at-least-32-characters' > data/drill-secrets/backup_encryption_key
          chmod 600 data/drill-secrets/*
      - name: Build production API used by the restored application
        run: docker build -f docker/api/Dockerfile -t botparty-restore-drill-api:${{ github.sha }} .
      - name: Create release backup
        env:
          DATABASE_URL: postgresql://postgres:source_password@127.0.0.1:35432/botparty?schema=public
          BACKUP_S3_ENDPOINT: http://127.0.0.1:39000
          BACKUP_S3_ACCESS_KEY: source_access
          BACKUP_S3_SECRET_KEY_FILE: ${{ github.workspace }}/data/drill-secrets/backup_s3_secret
          BACKUP_ENCRYPTION_KEY_FILE: ${{ github.workspace }}/data/drill-secrets/backup_encryption_key
          BACKUP_DATABASE_DOCKER_NETWORK: host
          BACKUP_OBJECT_DOCKER_NETWORK: host
        run: ./scripts/backup-release.sh data/backups
      - name: Restore into a new isolated environment
        env:
          RESTORE_SECRET_DIR: ${{ github.workspace }}/data/drill-secrets
          RESTORE_API_IMAGE: botparty-restore-drill-api:${{ github.sha }}
          RESTORE_TEST_EMAIL: admin@botparty.test
          RESTORE_TEST_PASSWORD_FILE: ${{ github.workspace }}/data/drill-secrets/seed_admin_password
          BACKUP_ENCRYPTION_KEY_FILE: ${{ github.workspace }}/data/drill-secrets/backup_encryption_key
        run: ./scripts/restore-drill.sh "$(find data/backups -name 'botparty-release-*.tar.gz.enc' -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: restore-drill-report
          path: data/restore-drills/*.json
          if-no-files-found: error
