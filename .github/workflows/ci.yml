name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  migrations:
    name: Fresh + upgrade migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: botparty
          POSTGRES_PASSWORD: botparty_ci
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botparty -d migration_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:verify-migrations
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://botparty:botparty_ci@127.0.0.1:5432/migration_test?schema=public
      - run: pnpm db:upgrade:postgres18:test

  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.20.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Check environment documentation parity
        run: pnpm env:check

      - name: Test production preflight rules
        run: pnpm production:preflight:test

      - name: Check literal dotenv loading
        run: sh scripts/test-dotenv-loader.sh

      - name: Check web module architecture budgets
        run: pnpm architecture:check

      - name: Typecheck
        run: pnpm typecheck

  observability-config:
    name: Prometheus and Alertmanager config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Prometheus configuration and rules
        run: |
          image='prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893'
          docker run --rm --entrypoint /bin/promtool -v "$PWD/docker/prometheus:/etc/prometheus:ro" "$image" check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/docker/prometheus:/etc/prometheus:ro" "$image" check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/docker/prometheus:/etc/prometheus:ro" -w /etc/prometheus "$image" test rules alerts.test.yml
      - name: Validate Alertmanager configuration
        run: |
          sh -n docker/alertmanager/entrypoint.sh
          printf 'https://alerts.example.invalid/botparty\n' > /tmp/alertmanager_webhook_url
          docker run --rm \
            -v "$PWD/docker/alertmanager:/etc/alertmanager:ro" \
            -v /tmp/alertmanager_webhook_url:/run/secrets/alertmanager_webhook_url:ro \
            --entrypoint /bin/sh prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba \
            /etc/alertmanager/entrypoint.sh --check

  dev-compose:
    name: Development Compose images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate merged development configuration
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
        env:
          LIVEKIT_API_KEY: botparty-ci-livekit-key
          OBJECT_STORAGE_SECRET_ACCESS_KEY: botparty-ci-object-storage-secret
      - name: Build hot-reload API and Web images
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build api web
        env:
          LIVEKIT_API_KEY: botparty-ci-livekit-key
          OBJECT_STORAGE_SECRET_ACCESS_KEY: botparty-ci-object-storage-secret
      - name: Start hot-reload stack and verify runtime health
        run: DEV_COMPOSE_SKIP_BUILD=true ./scripts/smoke-dev-compose.sh

  queue-benchmark:
    name: Queue 1,000-entry budget
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: botparty
          POSTGRES_PASSWORD: botparty_ci
          POSTGRES_DB: queue_benchmark
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U botparty -d queue_benchmark"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with: { version: 11.20.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @botparty/prisma db:migrate:prod
        env:
          DATABASE_URL: postgresql://botparty:botparty_ci@127.0.0.1:5432/queue_benchmark?schema=public
      - run: pnpm benchmark:queue
        env:
          DATABASE_URL: postgresql://botparty:botparty_ci@127.0.0.1:5432/queue_benchmark?schema=public
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_BENCHMARK_ALLOW_WRITES: 'true'

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.20.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @botparty/shared build

      - name: Run API tests
        run: pnpm --filter @botparty/api test

      - name: Run Web tests
        run: pnpm --filter @botparty/web test

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.20.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @botparty/shared build

      - name: Run API coverage
        run: pnpm --filter @botparty/api test:coverage

      - name: Run Web coverage
        run: pnpm --filter @botparty/web test:coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: error

  e2e:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: botparty
          POSTGRES_PASSWORD: botparty_ci
          POSTGRES_DB: botparty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botparty -d botparty"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.20.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @botparty/shared build

      - name: Install Playwright browser
        run: pnpm --filter @botparty/web exec playwright install --with-deps chromium

      - name: Provision API schema and deterministic fixtures
        run: |
          pnpm --filter @botparty/prisma db:migrate:prod
          pnpm --filter @botparty/prisma db:seed
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://botparty:botparty_ci@127.0.0.1:5432/botparty?schema=public
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          CORS_ORIGIN: http://127.0.0.1:3000
          PUBLIC_WEB_URL: http://127.0.0.1:3000
          JWT_SECRET: test-jwt-secret-that-is-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-chars
          ROBOT_JWT_SECRET: test-robot-secret-that-is-at-least-32-chars
          LIVEKIT_API_KEY: test-livekit-key
          LIVEKIT_API_SECRET: test-livekit-secret-that-is-at-least-32-chars
          LIVEKIT_URL: ws://127.0.0.1:7880
          WEBHOOK_SECRET_ENCRYPTION_KEY: test-webhook-secret-that-is-at-least-32-chars
          SEED_ADMIN_EMAIL: admin@botparty.test
          SEED_ADMIN_USERNAME: e2e_admin
          SEED_ADMIN_PASSWORD: e2e-admin-password-at-least-16
          SEED_DEMO_USER_PASSWORD: e2e-user-password
          SEED_E2E_FIXTURES: 'true'

      - name: Run Web E2E tests
        run: pnpm --filter @botparty/web test:e2e --project=chromium
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://botparty:botparty_ci@127.0.0.1:5432/botparty?schema=public
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          CORS_ORIGIN: http://127.0.0.1:3000
          PUBLIC_WEB_URL: http://127.0.0.1:3000
          JWT_SECRET: test-jwt-secret-that-is-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-chars
          ROBOT_JWT_SECRET: test-robot-secret-that-is-at-least-32-chars
          LIVEKIT_API_KEY: test-livekit-key
          LIVEKIT_API_SECRET: test-livekit-secret-that-is-at-least-32-chars
          LIVEKIT_URL: ws://127.0.0.1:7880
          WEBHOOK_SECRET_ENCRYPTION_KEY: test-webhook-secret-that-is-at-least-32-chars
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:4000
          NEXT_PUBLIC_LIVEKIT_URL: ws://127.0.0.1:7880
          API_URL: http://127.0.0.1:4000
          E2E_ADMIN_PASSWORD: e2e-admin-password-at-least-16
          E2E_USER_PASSWORD: e2e-user-password

      - name: Build applications for Lighthouse
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:4000
          NEXT_PUBLIC_LIVEKIT_URL: ws://127.0.0.1:7880
          NEXT_PUBLIC_LEGAL_OPERATOR_NAME: BotParty CI Operator
          NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL: operator@example.com
          NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS: 1 CI Street, Test City
          NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY: Germany
          NEXT_PUBLIC_LEGAL_GOVERNING_LAW: Germany
          API_URL: http://127.0.0.1:4000

      - name: Run Lighthouse mobile budgets
        run: pnpm --filter @botparty/web performance:lighthouse
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://botparty:botparty_ci@127.0.0.1:5432/botparty?schema=public
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          CORS_ORIGIN: http://127.0.0.1:3000
          PUBLIC_WEB_URL: http://127.0.0.1:3000
          JWT_SECRET: test-jwt-secret-that-is-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-chars
          ROBOT_JWT_SECRET: test-robot-secret-that-is-at-least-32-chars
          LIVEKIT_API_KEY: test-livekit-key
          LIVEKIT_API_SECRET: test-livekit-secret-that-is-at-least-32-chars
          LIVEKIT_URL: ws://127.0.0.1:7880
          WEBHOOK_SECRET_ENCRYPTION_KEY: test-webhook-secret-that-is-at-least-32-chars
          API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:4000
          NEXT_PUBLIC_LIVEKIT_URL: ws://127.0.0.1:7880
          LHCI_ADMIN_EMAIL: admin@botparty.test
          LHCI_ADMIN_PASSWORD: e2e-admin-password-at-least-16

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          if-no-files-found: error

  production-docker-e2e:
    name: Production Docker E2E
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the release images and run the isolated browser suite
        run: ./scripts/test-e2e-docker.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      [
        dependency-audit,
        dev-compose,
        migrations,
        observability-config,
        queue-benchmark,
        lint-and-typecheck,
        production-docker-e2e,
        test,
        coverage,
        e2e,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.20.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_WS_URL: ws://localhost:4000
          NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
          NEXT_PUBLIC_LEGAL_OPERATOR_NAME: BotParty CI Operator
          NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL: operator@example.com
          NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS: 1 CI Street, Test City
          NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY: Germany
          NEXT_PUBLIC_LEGAL_GOVERNING_LAW: Germany
          API_URL: http://localhost:4000

      - name: Enforce route bundle budgets
        run: pnpm --filter @botparty/web performance:budget

      - name: Export OpenAPI spec
        run: node apps/api/dist/openapi/export-openapi.js docs/openapi.json
        env:
          DATABASE_URL: postgresql://botparty:botparty@localhost:5432/botparty?schema=public
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          CORS_ORIGIN: http://localhost:3000
          JWT_SECRET: test-jwt-secret-that-is-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-32-chars
          ROBOT_JWT_SECRET: test-robot-secret-that-is-at-least-32-chars
          LIVEKIT_API_KEY: test-livekit-key
          LIVEKIT_API_SECRET: test-livekit-secret-that-is-at-least-32-chars

      - name: Regenerate client contracts
        run: pnpm docs:api-client

      - name: Check OpenAPI drift
        run: git diff --exit-code -- docs/openapi.json docs/api-client.md

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: docs/openapi.json
          if-no-files-found: error
