name: Performance Smoke

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run isolated Docker performance smoke
        env:
          PERFORMANCE_REPORT_DIR: data/performance-smoke
        run: ./scripts/run-performance-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: performance-smoke-report
          path: data/performance-smoke/result.json
          if-no-files-found: error
