name: Performance Smoke

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run isolated Docker performance smoke
        env:
          PERFORMANCE_REPORT_DIR: data/performance-smoke
        run: ./scripts/run-performance-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-smoke-report
          path: data/performance-smoke/result.json
          if-no-files-found: error
