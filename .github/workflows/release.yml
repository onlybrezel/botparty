name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer tag to publish (for documentation only when rerunning)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository_owner }}/botparty-api
  WEB_IMAGE: ${{ github.repository_owner }}/botparty-web

jobs:
  publish:
    name: Publish release images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata
        id: api-meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=BotParty API
            org.opencontainers.image.description=BotParty NestJS API image

      - name: Extract Web image metadata
        id: web-meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=BotParty Web
            org.opencontainers.image.description=BotParty Next.js web image

      - name: Build and push API image
        id: api-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api

      - name: Build and push Web image
        id: web-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
            NEXT_PUBLIC_LEGAL_OPERATOR_NAME=${{ vars.NEXT_PUBLIC_LEGAL_OPERATOR_NAME }}
            NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL=${{ vars.NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL }}
            NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS=${{ vars.NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS }}
            NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY=${{ vars.NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY }}
            NEXT_PUBLIC_LEGAL_GOVERNING_LAW=${{ vars.NEXT_PUBLIC_LEGAL_GOVERNING_LAW }}
            NEXT_PUBLIC_LEGAL_VAT_ID=${{ vars.NEXT_PUBLIC_LEGAL_VAT_ID }}
            NEXT_PUBLIC_LEGAL_COMMERCIAL_REGISTER=${{ vars.NEXT_PUBLIC_LEGAL_COMMERCIAL_REGISTER }}
            NEXT_PUBLIC_LEGAL_SUPPORT_URL=${{ vars.NEXT_PUBLIC_LEGAL_SUPPORT_URL }}
            NEXT_PUBLIC_IMAGE_REMOTE_HOSTS=${{ vars.NEXT_PUBLIC_IMAGE_REMOTE_HOSTS }}
            NEXT_PUBLIC_FEATURE_BILLING=${{ vars.FEATURE_BILLING_ENABLED || 'false' }}
            NEXT_PUBLIC_FEATURE_DONATIONS=${{ vars.FEATURE_DONATIONS_ENABLED || 'false' }}
            NEXT_PUBLIC_FEATURE_PAYOUTS=${{ vars.FEATURE_PAYOUTS_ENABLED || 'false' }}
            NEXT_PUBLIC_FEATURE_PAID_CONTROLS=${{ vars.FEATURE_PAID_CONTROLS_ENABLED || 'false' }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign API image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.API_IMAGE }}@${{ steps.api-build.outputs.digest }}"

      - name: Sign Web image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}@${{ steps.web-build.outputs.digest }}"

      - name: Publish operator release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --verify-tag --title "BotParty ${{ github.ref_name }}" --notes-file docs/release-template.md
