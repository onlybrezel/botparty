name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing SemVer tag to republish (for example v0.1.4)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository_owner }}/botparty-api
  WEB_IMAGE: ${{ github.repository_owner }}/botparty-web

jobs:
  verify-source:
    name: Verify tagged release source
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: botparty
          POSTGRES_PASSWORD: botparty_release
          POSTGRES_DB: release_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botparty -d release_migration_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a SemVer tag from main
        id: source
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${REQUESTED_VERSION}"
          fi
          if [[ ! "${version}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be a SemVer tag such as v0.1.4" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/tags/${version}" ]]; then
            echo "Run the workflow from the existing tag ${version}, not from a branch" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Release tag ${version} is not reachable from origin/main" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Verify release quality gates
        run: |
          pnpm env:check
          pnpm architecture:check
          pnpm lint
          pnpm typecheck
          pnpm --filter @botparty/api test
          pnpm --filter @botparty/web test
          pnpm audit --prod --audit-level high
      - name: Verify fresh and upgrade migrations
        run: pnpm db:verify-migrations
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://botparty:botparty_release@127.0.0.1:5432/release_migration_test?schema=public

  publish:
    name: Publish release images
    needs: verify-source
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata
        id: api-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify-source.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify-source.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.verify-source.outputs.version }},enable=${{ !startsWith(needs.verify-source.outputs.version, 'v0.') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=BotParty API
            org.opencontainers.image.description=BotParty NestJS API image

      - name: Extract Web image metadata
        id: web-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify-source.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify-source.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.verify-source.outputs.version }},enable=${{ !startsWith(needs.verify-source.outputs.version, 'v0.') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=BotParty Web
            org.opencontainers.image.description=BotParty Next.js web image

      - name: Build and push API image
        id: api-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api

      - name: Build and push Web image
        id: web-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify-source.outputs.version }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
            NEXT_PUBLIC_LEGAL_OPERATOR_NAME=${{ vars.NEXT_PUBLIC_LEGAL_OPERATOR_NAME }}
            NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL=${{ vars.NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL }}
            NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS=${{ vars.NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS }}
            NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY=${{ vars.NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY }}
            NEXT_PUBLIC_LEGAL_GOVERNING_LAW=${{ vars.NEXT_PUBLIC_LEGAL_GOVERNING_LAW }}
            NEXT_PUBLIC_LEGAL_VAT_ID=${{ vars.NEXT_PUBLIC_LEGAL_VAT_ID }}
            NEXT_PUBLIC_LEGAL_COMMERCIAL_REGISTER=${{ vars.NEXT_PUBLIC_LEGAL_COMMERCIAL_REGISTER }}
            NEXT_PUBLIC_LEGAL_SUPPORT_URL=${{ vars.NEXT_PUBLIC_LEGAL_SUPPORT_URL }}
            NEXT_PUBLIC_IMAGE_REMOTE_HOSTS=${{ vars.NEXT_PUBLIC_IMAGE_REMOTE_HOSTS }}
            NEXT_PUBLIC_FEATURE_BILLING=${{ vars.FEATURE_BILLING_ENABLED || 'false' }}
            NEXT_PUBLIC_FEATURE_DONATIONS=${{ vars.FEATURE_DONATIONS_ENABLED || 'false' }}
            NEXT_PUBLIC_FEATURE_PAYOUTS=${{ vars.FEATURE_PAYOUTS_ENABLED || 'false' }}
            NEXT_PUBLIC_FEATURE_PAID_CONTROLS=${{ vars.FEATURE_PAID_CONTROLS_ENABLED || 'false' }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign API image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.API_IMAGE }}@${{ steps.api-build.outputs.digest }}"

      - name: Sign Web image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}@${{ steps.web-build.outputs.digest }}"

      - name: Publish operator release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ needs.verify-source.outputs.version }}" >/dev/null 2>&1 || gh release create "${{ needs.verify-source.outputs.version }}" --verify-tag --title "BotParty ${{ needs.verify-source.outputs.version }}" --notes-file docs/release-template.md
