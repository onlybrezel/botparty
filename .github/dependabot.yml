version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      workspace-nonmajor:
        dependency-type: production
        update-types:
          - minor
          - patch
      workspace-dev-nonmajor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /docker/api
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /docker/web
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
    open-pull-requests-limit: 5
