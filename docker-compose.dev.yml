# ─────────────────────────────────────────────────────
# BotParty – Docker Compose Dev Overrides
# ─────────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Differences from production:
#   - API and Web run with hot-reload / dev mode
#   - Source code is bind-mounted for instant changes
#   - No nginx (access API on :4000, web on :3000 directly)
#   - Debug logging enabled
#   - cAdvisor and livekit egress/ingress are not included
# ─────────────────────────────────────────────────────

services:
  migrate:
    build:
      target: dev
    image: botparty-api:dev
    environment:
      NODE_ENV: development
    read_only: false

  api:
    build:
      target: dev
    image: botparty-api:dev
    environment:
      NODE_ENV: development
      APP_URL: ${APP_URL:-http://localhost:3000}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_COOKIE_SECURE: "false"
      LIVEKIT_PUBLIC_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      THUMBNAIL_PUBLIC_BASE_URL: ${THUMBNAIL_PUBLIC_BASE_URL:-http://localhost:9000/botparty-thumbnails}
    read_only: false
    volumes:
      - ${API_SOURCE_DIR:-./apps/api/src}:/app/apps/api/src:delegated
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    # Override the prod command with dev server (ts-node / nest start --watch)
    command: ["pnpm", "--filter", "@botparty/api", "dev"]

  web:
    build:
      target: dev
    image: botparty-web:dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      NEXT_PUBLIC_LEGAL_OPERATOR_NAME: ${NEXT_PUBLIC_LEGAL_OPERATOR_NAME:-BotParty Local}
      NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL: ${NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL:-local@localhost.invalid}
      NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS: ${NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS:-Local development}
      NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY: ${NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY:-Germany}
      NEXT_PUBLIC_LEGAL_GOVERNING_LAW: ${NEXT_PUBLIC_LEGAL_GOVERNING_LAW:-Germany}
    read_only: false
    volumes:
      - ${WEB_SOURCE_DIR:-./apps/web/src}:/app/apps/web/src:delegated
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    command: ["pnpm", "--filter", "@botparty/web", "dev"]
