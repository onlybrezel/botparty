# ─────────────────────────────────────────────────────
# BotParty – Docker Compose
# ─────────────────────────────────────────────────────
# Usage:
#   docker compose up -d           # Start all services
#   docker compose logs -f api     # Follow API logs
#   docker compose down -v         # Stop & remove volumes
#
# Network layout:
#   internal  (bridge, internal) – postgres, redis, livekit, api
#   frontend  (bridge)           – nginx, web, api
#   The API bridges both so it can reach db/redis while nginx proxies to it.
# ─────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════
  # PostgreSQL
  # ═══════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: botparty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: botparty
      POSTGRES_USER: botparty
      POSTGRES_PASSWORD: ${DB_PASSWORD:-botparty_secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botparty"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ═══════════════════════════════════════════════════
  # Redis
  # ═══════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: botparty-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-botparty_redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-botparty_redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: botparty-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - frontend

  # ═══════════════════════════════════════════════════
  # LiveKit Server (SFU)
  # ═══════════════════════════════════════════════════
  livekit:
    image: livekit/livekit-server:latest
    container_name: botparty-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # network_mode: host lets livekit bind directly to the host's network stack.
    # This makes all ports (7880 TCP/WS and 50000-50100 UDP for WebRTC ICE)
    # available on the host's IP without manual port mapping.
    network_mode: host
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:7880 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: botparty-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthz 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════
  # BotParty API (NestJS)
  # ═══════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: botparty-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://botparty:${DB_PASSWORD:-botparty_secret}@postgres:5432/botparty?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-botparty_redis_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_min_32_chars_long!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_min_32_chars!!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PASSWORD_RESET_TTL_SEC: ${PASSWORD_RESET_TTL_SEC:-3600}
      APP_URL: ${APP_URL:-https://botparty.live}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-BotParty <no-reply@botparty.live>}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret_that_is_at_least_32_characters_long}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://botparty.live/livekit}
      CADVISOR_URL: ${CADVISOR_URL:-http://cadvisor:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://botparty.live}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      livekit:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    networks:
      - internal
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4000/api/v1/health 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ═══════════════════════════════════════════════════
  # BotParty Web (Next.js)
  # ═══════════════════════════════════════════════════
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: botparty-web
    restart: unless-stopped
    environment:
      # SSR-internal URL (used by Next.js server-side fetch, container-to-container)
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://botparty.live/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://botparty.live}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-wss://botparty.live/livekit}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ═══════════════════════════════════════════════════
  # NGINX Reverse Proxy
  # ═══════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: botparty-nginx
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./docker/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:

networks:
  # SEC: internal blocks all external/internet traffic – db, cache, livekit
  # are not reachable from the host or web tier directly
  internal:
    driver: bridge
    internal: true
  # frontend: nginx, web, and the API (which bridges both networks)
  frontend:
    driver: bridge
