# ─────────────────────────────────────────────────────
# BotParty – Docker Compose
# ─────────────────────────────────────────────────────
# Usage:
#   docker compose up -d           # Start all services
#   docker compose logs -f api     # Follow API logs
#   docker compose down -v         # Stop & remove volumes
#
# Network layout:
#   internal  (bridge, internal) – postgres, redis, livekit, api
#   frontend  (bridge)           – nginx, web, api
#   The API bridges both so it can reach db/redis while nginx proxies to it.
# ─────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════
  # PostgreSQL
  # ═══════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: botparty-postgres
    restart: on-failure:10
    environment:
      POSTGRES_DB: botparty
      POSTGRES_USER: botparty
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      # Exposed on 5433 (not 5432) to avoid clashing with a local Postgres install.
      # The API container connects on the default 5432 via the internal Docker network.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botparty"]
      interval: 2s
      timeout: 2s
      retries: 15

  # ═══════════════════════════════════════════════════
  # Redis
  # ═══════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: botparty-redis
    restart: on-failure:10
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6379"]
      interval: 2s
      timeout: 2s
      retries: 15

  # ═══════════════════════════════════════════════════
  # LiveKit Server (SFU)
  # ═══════════════════════════════════════════════════
  livekit:
    image: livekit/livekit-server:v1.8
    container_name: botparty-livekit
    restart: on-failure:10
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - frontend
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:7880 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit-ingress:
    image: livekit/ingress:v1.4
    container_name: botparty-livekit-ingress
    restart: on-failure:10
    ports:
      - "8080:8080"
      - "7882:7882/tcp"
      - "7885:7885/udp"
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
        log_level: info
        health_port: 9091
        whip_port: 8080
        rtc_config:
          use_external_ip: true
          tcp_port: 7882
          udp_port: 7885
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - internal
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9091/ 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit-egress:
    image: livekit/egress:v1.8
    container_name: botparty-livekit-egress
    restart: on-failure:10
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
        log_level: warn
        health_port: 9090
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    volumes:
      - ./data/livekit-recordings:/out
    networks:
      - internal
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9090/ 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: botparty-cadvisor
    restart: on-failure:10
    # privileged: required by cAdvisor to read hardware and container metrics from /sys and /dev.
    # All volume mounts below are read-only — the elevated privilege is limited to kernel metric access.
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthz 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════
  # BotParty API (NestJS)
  # ═══════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: botparty-api:${APP_VERSION:-latest}
    container_name: botparty-api
    restart: on-failure:10
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://botparty:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/botparty?schema=public&sslmode=disable
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-/run/secrets/api_database_url}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:-/run/secrets/redis_password}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-/run/secrets/jwt_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      JWT_REFRESH_SECRET_FILE: ${JWT_REFRESH_SECRET_FILE:-/run/secrets/jwt_refresh_secret}
      ROBOT_JWT_SECRET: ${ROBOT_JWT_SECRET:?Set ROBOT_JWT_SECRET}
      ROBOT_JWT_SECRET_FILE: ${ROBOT_JWT_SECRET_FILE:-/run/secrets/robot_jwt_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PASSWORD_RESET_TTL_SEC: ${PASSWORD_RESET_TTL_SEC:-3600}
      APP_URL: ${APP_URL:-https://botparty.live}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-/run/secrets/smtp_password}
      SMTP_FROM: ${SMTP_FROM:-BotParty <no-reply@botparty.live>}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      LIVEKIT_API_SECRET_FILE: ${LIVEKIT_API_SECRET_FILE:-/run/secrets/livekit_api_secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://botparty.live/rtc}
      LIVEKIT_RECORDING_FILEPATH_TEMPLATE: ${LIVEKIT_RECORDING_FILEPATH_TEMPLATE:-/out/{room_name}-{time}.mp4}
      LIVEKIT_RECORDINGS_DIR: ${LIVEKIT_RECORDINGS_DIR:-/recordings}
      CADVISOR_URL: ${CADVISOR_URL:-http://cadvisor:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://botparty.live}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      FASTIFY_BODY_LIMIT: ${FASTIFY_BODY_LIMIT:-5242880}
      THUMBNAIL_STORAGE_DIR: ${THUMBNAIL_STORAGE_DIR:-/app/data/robot-thumbnails}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_PASSWORD_FILE: ${SEED_ADMIN_PASSWORD_FILE:-/run/secrets/seed_admin_password}
      SEED_DEMO_USER_PASSWORD: ${SEED_DEMO_USER_PASSWORD:-}
      SEED_DEMO_USER_PASSWORD_FILE: ${SEED_DEMO_USER_PASSWORD_FILE:-/run/secrets/seed_demo_user_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      livekit-ingress:
        condition: service_started
      cadvisor:
        condition: service_started
    networks:
      - internal
      - frontend
    volumes:
      - ./data/livekit-recordings:/recordings
      - ./data/robot-thumbnails:/app/data/robot-thumbnails
      - ./docker/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4000/api/v1/health/live 2>/dev/null && echo ok || exit 1"]
      interval: 3s
      timeout: 2s
      start_period: 5s
      retries: 15

  # ═══════════════════════════════════════════════════
  # BotParty Web (Next.js)
  # ═══════════════════════════════════════════════════
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: botparty-web:${APP_VERSION:-latest}
    container_name: botparty-web
    restart: on-failure:10
    environment:
      # SSR-internal URL (used by Next.js server-side fetch, container-to-container)
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://botparty.live/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://botparty.live}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-wss://botparty.live/rtc}
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ 2>/dev/null && echo ok || exit 1"]
      interval: 3s
      timeout: 2s
      start_period: 5s
      retries: 15

  # ═══════════════════════════════════════════════════
  # NGINX Reverse Proxy
  # ═══════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: botparty-nginx
    restart: on-failure:10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./docker/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  # SEC: internal blocks all external/internet traffic – db, cache, livekit
  # are not reachable from the host or web tier directly
  internal:
    driver: bridge
    internal: true
  # frontend: nginx, web, and the API (which bridges both networks)
  frontend:
    driver: bridge
