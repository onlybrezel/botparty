# ─────────────────────────────────────────────────────
# BotParty – Docker Compose
# ─────────────────────────────────────────────────────
# Usage:
#   docker compose up -d           # Start all services
#   docker compose logs -f api     # Follow API logs
#   docker compose down -v         # Stop & remove volumes
#
# Network layout:
#   internal  (bridge, internal) – postgres, redis, livekit, api
#   frontend  (bridge)           – nginx, web, api
#   The API bridges both so it can reach db/redis while nginx proxies to it.
# ─────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════
  # PostgreSQL
  # ═══════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    restart: on-failure:10
    environment:
      POSTGRES_DB: botparty
      POSTGRES_USER: botparty
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    ports:
      # Exposed on 5433 (not 5432) to avoid clashing with a local Postgres install.
      # The API container connects on the default 5432 via the internal Docker network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${BOTPARTY_SECRET_DIR:-./docker/secrets}:/run/secrets:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botparty"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ═══════════════════════════════════════════════════
  # Redis
  # ═══════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    restart: on-failure:10
    entrypoint: ["/bin/sh", "-ec"]
    command: ['exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$(cat /run/secrets/redis_password)"']
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ${BOTPARTY_SECRET_DIR:-./docker/secrets}:/run/secrets:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M

  minio:
    image: minio/minio:latest
    restart: on-failure:10
    entrypoint: ["/bin/sh", "-ec"]
    command: ['export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)"; exec minio server /data --console-address :9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-botpartyminio}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
      - ${BOTPARTY_SECRET_DIR:-./docker/secrets}:/run/secrets:ro
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  minio-init:
    image: minio/mc:latest
    restart: on-failure:10
    entrypoint: /bin/sh
    command:
      - -c
      - |
        minio_password="$$(cat /run/secrets/minio_root_password)"
        until mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-botpartyminio}" "$${minio_password}"; do
          echo "waiting for minio..."
          sleep 2
        done
        mc mb -p local/${THUMBNAIL_S3_BUCKET:-botparty-thumbnails} || true
        mc anonymous set download local/${THUMBNAIL_S3_BUCKET:-botparty-thumbnails}
        mc mb -p local/${LIVEKIT_RECORDINGS_S3_BUCKET:-botparty-recordings} || true
        mc anonymous set none local/${LIVEKIT_RECORDINGS_S3_BUCKET:-botparty-recordings}
        if [ "${RECORDING_RETENTION_DAYS:-30}" -gt 0 ] 2>/dev/null; then
          mc ilm rule add --expire-days "${RECORDING_RETENTION_DAYS:-30}" local/${LIVEKIT_RECORDINGS_S3_BUCKET:-botparty-recordings} || true
        fi
    depends_on:
      minio:
        condition: service_started
    networks:
      - frontend
    volumes:
      - ${BOTPARTY_SECRET_DIR:-./docker/secrets}:/run/secrets:ro

  livekit-config:
    image: node:22-alpine
    restart: "no"
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY (must not be devkey)}
      LIVEKIT_WHIP_BASE_URL: ${LIVEKIT_WHIP_BASE_URL:-https://botparty.live/whip}
    command: ["node", "/scripts/render-livekit-config.mjs", "/output"]
    volumes:
      - ./scripts/render-livekit-config.mjs:/scripts/render-livekit-config.mjs:ro
      - ${BOTPARTY_SECRET_DIR:-./docker/secrets}:/run/secrets:ro
      - livekit_runtime_config:/output
    networks:
      - internal

  # ═══════════════════════════════════════════════════
  # LiveKit Server (SFU)
  # ═══════════════════════════════════════════════════
  livekit:
    image: livekit/livekit-server:v1.8
    restart: on-failure:10
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    depends_on:
      livekit-config:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
      - frontend
    volumes:
      - livekit_runtime_config:/run/livekit-config:ro
    command: --config /run/livekit-config/livekit.json
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:7880 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  livekit-ingress:
    image: livekit/ingress:v1.4
    restart: on-failure:10
    ports:
      - "8080:8080"
      - "7882:7882/tcp"
      - "7885:7885/udp"
    environment:
      INGRESS_CONFIG_FILE: /run/livekit-config/ingress.json
    depends_on:
      livekit-config:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - internal
      - frontend
    volumes:
      - livekit_runtime_config:/run/livekit-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9091/ 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  livekit-egress:
    image: livekit/egress:v1.8
    restart: on-failure:10
    environment:
      EGRESS_CONFIG_FILE: /run/livekit-config/egress.json
    depends_on:
      livekit-config:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - internal
      - frontend
    volumes:
      - livekit_runtime_config:/run/livekit-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9090/ 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  cadvisor:
    profiles: ["observability"]
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    restart: on-failure:10
    # privileged: required by cAdvisor to read hardware and container metrics from /sys and /dev.
    # All volume mounts below are read-only — the elevated privilege is limited to kernel metric access.
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthz 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════
  # BotParty API (NestJS)
  # ═══════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-onlybrezel}/botparty-api:${APP_VERSION:-latest}
    restart: on-failure:10
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-/run/secrets/api_database_url}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:-/run/secrets/redis_password}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-/run/secrets/jwt_secret}
      JWT_REFRESH_SECRET_FILE: ${JWT_REFRESH_SECRET_FILE:-/run/secrets/jwt_refresh_secret}
      ROBOT_JWT_SECRET_FILE: ${ROBOT_JWT_SECRET_FILE:-/run/secrets/robot_jwt_secret}
      WEBHOOK_SECRET_ENCRYPTION_KEY_FILE: ${WEBHOOK_SECRET_ENCRYPTION_KEY_FILE:-/run/secrets/webhook_secret_encryption_key}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      PAYOUT_DESTINATION_ENCRYPTION_KEY_FILE: ${PAYOUT_DESTINATION_ENCRYPTION_KEY_FILE:-/run/secrets/payout_destination_encryption_key}
      FEATURE_BILLING_ENABLED: ${FEATURE_BILLING_ENABLED:-false}
      FEATURE_DONATIONS_ENABLED: ${FEATURE_DONATIONS_ENABLED:-false}
      FEATURE_PAYOUTS_ENABLED: ${FEATURE_PAYOUTS_ENABLED:-false}
      FEATURE_PAID_CONTROLS_ENABLED: ${FEATURE_PAID_CONTROLS_ENABLED:-false}
      FEATURE_SUBSCRIPTIONS_ENABLED: ${FEATURE_SUBSCRIPTIONS_ENABLED:-false}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Strict}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      METRICS_AUTH_REQUIRED: ${METRICS_AUTH_REQUIRED:-true}
      METRICS_USERNAME: ${METRICS_USERNAME:-metrics}
      METRICS_PASSWORD_FILE: ${METRICS_PASSWORD_FILE:-/run/secrets/metrics_password}
      PASSWORD_RESET_TTL_SEC: ${PASSWORD_RESET_TTL_SEC:-3600}
      RECORDING_SIGNED_URL_TTL_SEC: ${RECORDING_SIGNED_URL_TTL_SEC:-300}
      APP_URL: ${APP_URL:-https://botparty.live}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-/run/secrets/smtp_password}
      SMTP_FROM: ${SMTP_FROM:-BotParty <no-reply@botparty.live>}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY (must not be devkey)}
      LIVEKIT_API_SECRET_FILE: ${LIVEKIT_API_SECRET_FILE:-/run/secrets/livekit_api_secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://botparty.live/rtc}
      LIVEKIT_RECORDING_OBJECT_KEY_TEMPLATE: ${LIVEKIT_RECORDING_OBJECT_KEY_TEMPLATE:-sessions/{session_id}/{camera_id}-{time}.mp4}
      LIVEKIT_RECORDINGS_S3_BUCKET: ${LIVEKIT_RECORDINGS_S3_BUCKET:-botparty-recordings}
      LIVEKIT_RECORDINGS_S3_REGION: ${LIVEKIT_RECORDINGS_S3_REGION:-us-east-1}
      LIVEKIT_RECORDINGS_S3_ENDPOINT: ${LIVEKIT_RECORDINGS_S3_ENDPOINT:-http://minio:9000}
      LIVEKIT_RECORDINGS_S3_ACCESS_KEY_ID: ${LIVEKIT_RECORDINGS_S3_ACCESS_KEY_ID:-botpartyminio}
      LIVEKIT_RECORDINGS_S3_SECRET_ACCESS_KEY_FILE: ${LIVEKIT_RECORDINGS_S3_SECRET_ACCESS_KEY_FILE:-/run/secrets/minio_root_password}
      LIVEKIT_RECORDINGS_S3_FORCE_PATH_STYLE: ${LIVEKIT_RECORDINGS_S3_FORCE_PATH_STYLE:-true}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
      CADVISOR_URL: ${CADVISOR_URL:-http://cadvisor:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://botparty.live}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      FASTIFY_BODY_LIMIT: ${FASTIFY_BODY_LIMIT:-1048576}
      THUMBNAIL_PUBLIC_BASE_URL: ${THUMBNAIL_PUBLIC_BASE_URL:-https://botparty.live/storage/botparty-thumbnails}
      THUMBNAIL_S3_BUCKET: ${THUMBNAIL_S3_BUCKET:-botparty-thumbnails}
      THUMBNAIL_S3_REGION: ${THUMBNAIL_S3_REGION:-us-east-1}
      THUMBNAIL_S3_ENDPOINT: ${THUMBNAIL_S3_ENDPOINT:-http://minio:9000}
      THUMBNAIL_S3_ACCESS_KEY_ID: ${THUMBNAIL_S3_ACCESS_KEY_ID:-botpartyminio}
      THUMBNAIL_S3_SECRET_ACCESS_KEY_FILE: ${THUMBNAIL_S3_SECRET_ACCESS_KEY_FILE:-/run/secrets/minio_root_password}
      THUMBNAIL_S3_FORCE_PATH_STYLE: ${THUMBNAIL_S3_FORCE_PATH_STYLE:-true}
      SEED_ADMIN_PASSWORD_FILE: ${SEED_ADMIN_PASSWORD_FILE:-/run/secrets/seed_admin_password}
      SEED_DEMO_USER_PASSWORD_FILE: ${SEED_DEMO_USER_PASSWORD_FILE:-/run/secrets/seed_demo_user_password}
      STRIPE_SECRET_KEY_FILE: ${STRIPE_SECRET_KEY_FILE:-/run/secrets/stripe_secret_key}
      STRIPE_WEBHOOK_SECRET_FILE: ${STRIPE_WEBHOOK_SECRET_FILE:-/run/secrets/stripe_webhook_secret}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET_FILE: ${PAYPAL_CLIENT_SECRET_FILE:-/run/secrets/paypal_client_secret}
      PAYPAL_WEBHOOK_ID_FILE: ${PAYPAL_WEBHOOK_ID_FILE:-/run/secrets/paypal_webhook_id}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      livekit-ingress:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - internal
      - frontend
    volumes:
      - ${BOTPARTY_SECRET_DIR:-./docker/secrets}:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4000/api/v1/health/ready 2>/dev/null && echo ok || exit 1"]
      interval: 3s
      timeout: 2s
      start_period: 5s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ═══════════════════════════════════════════════════
  # BotParty Web (Next.js)
  # ═══════════════════════════════════════════════════
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
        PUBLIC_DEPLOYMENT: ${PUBLIC_DEPLOYMENT:-true}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
        NEXT_PUBLIC_LEGAL_OPERATOR_NAME: ${NEXT_PUBLIC_LEGAL_OPERATOR_NAME:-}
        NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL: ${NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL:-}
        NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS: ${NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS:-}
        NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY: ${NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY:-}
        NEXT_PUBLIC_LEGAL_GOVERNING_LAW: ${NEXT_PUBLIC_LEGAL_GOVERNING_LAW:-}
        NEXT_PUBLIC_LEGAL_VAT_ID: ${NEXT_PUBLIC_LEGAL_VAT_ID:-}
        NEXT_PUBLIC_LEGAL_COMMERCIAL_REGISTER: ${NEXT_PUBLIC_LEGAL_COMMERCIAL_REGISTER:-}
        NEXT_PUBLIC_LEGAL_SUPPORT_URL: ${NEXT_PUBLIC_LEGAL_SUPPORT_URL:-}
        NEXT_PUBLIC_IMAGE_REMOTE_HOSTS: ${NEXT_PUBLIC_IMAGE_REMOTE_HOSTS:-}
        NEXT_PUBLIC_FEATURE_BILLING: ${FEATURE_BILLING_ENABLED:-false}
        NEXT_PUBLIC_FEATURE_DONATIONS: ${FEATURE_DONATIONS_ENABLED:-false}
        NEXT_PUBLIC_FEATURE_PAYOUTS: ${FEATURE_PAYOUTS_ENABLED:-false}
        NEXT_PUBLIC_FEATURE_PAID_CONTROLS: ${FEATURE_PAID_CONTROLS_ENABLED:-false}
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-onlybrezel}/botparty-web:${APP_VERSION:-latest}
    restart: on-failure:10
    environment:
      # SSR-internal URL (used by Next.js server-side fetch, container-to-container)
      API_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://botparty.live/}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://botparty.live/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://botparty.live}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-wss://botparty.live/rtc}
      NEXT_PUBLIC_LEGAL_OPERATOR_NAME: ${NEXT_PUBLIC_LEGAL_OPERATOR_NAME:-}
      NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL: ${NEXT_PUBLIC_LEGAL_OPERATOR_EMAIL:-}
      NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS: ${NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS:-}
      NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY: ${NEXT_PUBLIC_LEGAL_OPERATOR_COUNTRY:-Germany}
      NEXT_PUBLIC_LEGAL_GOVERNING_LAW: ${NEXT_PUBLIC_LEGAL_GOVERNING_LAW:-Germany}
      NEXT_PUBLIC_LEGAL_VAT_ID: ${NEXT_PUBLIC_LEGAL_VAT_ID:-}
      NEXT_PUBLIC_LEGAL_COMMERCIAL_REGISTER: ${NEXT_PUBLIC_LEGAL_COMMERCIAL_REGISTER:-}
      NEXT_PUBLIC_LEGAL_SUPPORT_URL: ${NEXT_PUBLIC_LEGAL_SUPPORT_URL:-}
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ 2>/dev/null && echo ok || exit 1"]
      interval: 3s
      timeout: 2s
      start_period: 5s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ═══════════════════════════════════════════════════
  # NGINX Reverse Proxy
  # ═══════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    restart: on-failure:10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./docker/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/api/v1/health/live 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    restart: on-failure:10
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${BOTPARTY_SECRET_DIR:-./docker/secrets}/metrics_password:/run/secrets/metrics_password:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
      alertmanager:
        condition: service_started
    networks:
      - internal
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.28.1
    restart: on-failure:10
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./docker/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ${BOTPARTY_SECRET_DIR:-./docker/secrets}/alertmanager_webhook_url:/run/secrets/alertmanager_webhook_url:ro
      - alertmanager_data:/alertmanager
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ═══════════════════════════════════════════════════
  # Optional centralized logs (Loki + Promtail)
  # ═══════════════════════════════════════════════════
  loki:
    profiles: ["observability-logs"]
    image: grafana/loki:3.2.1
    restart: on-failure:10
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  promtail:
    profiles: ["observability-logs"]
    image: grafana/promtail:3.2.1
    restart: on-failure:10
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./docker/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  alertmanager_data:
  livekit_runtime_config:

networks:
  # SEC: internal blocks all external/internet traffic – db, cache, livekit
  # are not reachable from the host or web tier directly
  internal:
    driver: bridge
    internal: true
  # frontend: nginx, web, and the API (which bridges both networks)
  frontend:
    driver: bridge
